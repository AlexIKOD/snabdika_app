[package]
name = "snabdika-shell"
version = "0.1.0"
description = "Snabdika desktop shell"
authors = ["Snabdika Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2-zlib-rs"] }
arrow-array = "60"
arrow-schema = "60"

keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
uuid = { version = "1", features = ["v4"] }
